project_id = "closetos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Local-dev auth settings. The hosted project's Site URL + redirect allow-list are
# set by .github/workflows/supabase-deploy.yml (Management API PATCH) — keep the
# two lists in sync when adding a callback.
[auth]
enabled = true
site_url = "https://closetos-iota.vercel.app"
additional_redirect_urls = [
  "https://closetos-iota.vercel.app/auth/callback",
  "https://closetos-iota.vercel.app/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3001/auth/callback",
  "closetos://auth/callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
