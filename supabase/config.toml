project_id = "closetos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Everything declared under [auth] is pushed to the hosted project
# (ncowtwpxvefhbljwfsxo) with `supabase config push`. Run `supabase config diff`
# first — push reconciles every declared key, so keep this section limited to
# values that are meant to be identical locally and in production.
[auth]
enabled = true
site_url = "https://closetos-iota.vercel.app"
additional_redirect_urls = [
  "https://closetos-iota.vercel.app/auth/callback",
  "https://closetos-iota.vercel.app/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3001/auth/callback",
  "closetos://auth/callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Both email-link templates use the token_hash flow (see supabase/templates/).
# New users get "confirmation", returning users get "magic_link" — same body.
[auth.email.template.confirmation]
subject = "Sign in to ClosetOS"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.magic_link]
subject = "Sign in to ClosetOS"
content_path = "./supabase/templates/magic_link.html"

[storage]
enabled = true
file_size_limit = "50MiB"
